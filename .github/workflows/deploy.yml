name: Deploy site to Vercel

# Every push to main rebuilds and ships the docs site, so the live URL never
# falls behind. Requires three repo secrets:
#   VERCEL_TOKEN       — a Vercel access token (Account Settings → Tokens)
#   VERCEL_ORG_ID      — team_1QRUk3xJ5Hdjk57BhNPvl0eS
#   VERCEL_PROJECT_ID  — prj_pyYM1ONzFMNcc6f2e7UUFFksW2EP
#
# Prefer zero config? Connect this repo in the Vercel dashboard
# (Project → Settings → Git) instead and delete this file — that also gives
# per-PR preview deployments.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy (Vercel)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Uploads the repo; Vercel runs the build remotely per vercel.json
      # (build:site = build-storybook → astro build → assemble).
      - name: Deploy to production
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
